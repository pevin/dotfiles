# run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# ── Pane borders ────────────────────────────────────────────────────────────
set -g pane-border-style         "fg=#ddd4c8"
set -g pane-active-border-style  "fg=#7c5cad"

# ── Status bar ──────────────────────────────────────────────────────────────
set -g status                    on
set -g status-position           top
set -g status-style              "bg=#f4ede5,fg=#6c6f85"
set -g status-left-length        40
set -g status-right-length      120

set -g status-left  ""
# claude-cat: the rendered bar, pushed into this option on every state change so
# it paints immediately. No #() job -- tmux hooks set by claude-cat.tmux cover
# panes/sessions coming and going.
set -g status-right "#{@claude-cat-status} | #{?client_prefix,#[bg=#b4637a],#[bg=#7c5cad]}#[fg=#faf6f0,bold] #S #[bg=#f4ede5]#{?client_prefix,#[fg=#b4637a],#[fg=#7c5cad]} "

# ── Window tabs ─────────────────────────────────────────────────────────────
setw -g window-status-style          "fg=#9893a5,bg=#f4ede5"
setw -g window-status-format         " #I #W "
setw -g window-status-current-style  "fg=#4c4f69,bg=#e8ddd1,bold"
setw -g window-status-current-format " #I #W "
setw -g window-status-separator      ""

# ── Messages / command line ─────────────────────────────────────────────────
set -g message-style         "bg=#f5e0b7,fg=#4c4f69"
set -g message-command-style "bg=#f5e0b7,fg=#4c4f69"

# ── Copy mode ───────────────────────────────────────────────────────────────
setw -g mode-style "bg=#e8ddd1,fg=#4c4f69"
# v starts a selection, like vim's visual mode (Space still works). v was
# rectangle-toggle by default, but C-v is bound to that too, so nothing is lost.
bind-key -T copy-mode-vi v send-keys -X begin-selection

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @resurrect-dir '~/.local/share/tmux/resurrect'

# vim tmux nav
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# 5 is fine again: state changes no longer wait for this timer, it only covers
# sessions appearing/being killed and entries ageing out.
set -g status-interval           5
# claude-cat: meow only when Claude is waiting on you; Glass (default) on done
set -g @claude-cat-sound-waiting 'meow'
# one icon per Claude session, stacked on the tmux session name (option B)
set -g @claude-cat-multi 'stack'
# Standard icons for all four states: no @claude-cat-icon-* overrides, so the
# plugin's own defaults apply -- paw (waiting), bolt (working), check (done),
# circle (idle). They come from different glyph families, so in 'stack' mode a
# session with several Claudes shows them side by side at slightly different
# weights; swap in one family if that looks ragged.
# prefix + g -> jump to the session that is waiting (press again to cycle),
# plus the tmux hooks that re-render when panes/sessions come and go. Must come
# after the @claude-cat-* options above: it reads them at load time.
run-shell '/Users/pevin.elsenique/projects/tools/claude-cat/claude-cat.tmux'

# claude-cat trial: tmux-claude disabled so the two do not compete.
# Revert by uncommenting these two lines (and restoring settings.json).
# set -g @plugin 'smilovanovic/tmux-claude'
# run '~/.tmux/plugins/tmux-claude/claude.tmux'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# ── tmux-gx ─────────────────────────────────────────────────────────────────
# Rebinds `o` so the cursor only has to be somewhere on the line holding the
# URL -- no highlighting first, like vim's gx. Must come after tpm: whoever
# loads last wins the `o` binding, and tmux-open binds it too.
# ~/projects/tools/tmux-gx
run-shell '/Users/pevin.elsenique/projects/tools/tmux-gx/gx.tmux'
