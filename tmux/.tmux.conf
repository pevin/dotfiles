# set -g @catppuccin_status_right_background "#81a1c1"
# set -g @catppuccin_status_right_foreground "#2e3440"
#
# run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# ── Pane borders ────────────────────────────────────────────────────────────
set -g pane-border-style         "fg=#39404f"
set -g pane-active-border-style  "fg=#81a1c1"

# ── Status bar ──────────────────────────────────────────────────────────────
set -g status                    on
set -g status-position           top
set -g status-style              "bg=#232831,fg=#7e8188"
set -g status-left-length        40
set -g status-right-length      120

set -g status-left  ""
# claude-cat: the rendered bar, pushed into this option on every state change so
# it paints immediately. No #() job -- tmux hooks set by claude-cat.tmux cover
# panes/sessions coming and going.
set -g status-right "#{@claude-cat-status} | #{?client_prefix,#[bg=#bf616a],#[bg=#81a1c1]}#[fg=#232831,bold] #S #[bg=#232831]#{?client_prefix,#[fg=#bf616a],#[fg=#81a1c1]} "

# ── Window tabs ─────────────────────────────────────────────────────────────
setw -g window-status-style          "fg=#7e8188,bg=#232831"
setw -g window-status-format         " #I #W "
setw -g window-status-current-style  "fg=#cdcecf,bg=#3e4a5b,bold"
setw -g window-status-current-format " #I #W "
setw -g window-status-separator      ""

# ── Messages / command line ─────────────────────────────────────────────────
set -g message-style         "bg=#ebcb8b,fg=#232831"
set -g message-command-style "bg=#ebcb8b,fg=#232831"

# ── Copy mode ───────────────────────────────────────────────────────────────
setw -g mode-style "bg=#3e4a5b,fg=#cdcecf"
# prefix+v enters copy-mode, same as default prefix+[ -- but [ sits on a
# symbol layer in Graphite, so v (a bare base-layer key) is easier to reach.
bind-key v copy-mode
# v starts a selection, like vim's visual mode (Space still works). v was
# rectangle-toggle by default, but C-v is bound to that too, so nothing is lost.
bind-key -T copy-mode-vi v send-keys -X begin-selection

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'pevin/tmux-gx'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'pevin/claude-cat'

set -g @resurrect-dir '~/.local/share/tmux/resurrect'

# vim tmux nav
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# set -g status-interval           5
set -g @claude-cat-jump-states 'waiting done'
set -g @claude-cat-sound-waiting 'meow'
set -g @claude-cat-multi 'stack'
# working: nf-cod-sparkle
set -g @claude-cat-icon-working "\uec10"
# idle: nf-fa-moon_o in soft purple
set -g @claude-cat-icon-idle "\uf186"
set -g @claude-cat-color-idle '#907aa9'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

