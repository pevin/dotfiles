# Nordfox recolour of the pastel layout in .tmux.conf (same structure, new
# palette). Sourced from .tmux.conf; comment that line out to go back.
set -g pane-border-style         "fg=#39404f"
set -g pane-active-border-style  "fg=#81a1c1"

set -g status-style              "bg=#232831,fg=#7e8188"
set -g status-right "#{@claude-cat-status} | #{?client_prefix,#[bg=#bf616a],#[bg=#81a1c1]}#[fg=#232831,bold] #S #[bg=#232831]#{?client_prefix,#[fg=#bf616a],#[fg=#81a1c1]} "

setw -g window-status-style          "fg=#7e8188,bg=#232831"
setw -g window-status-current-style  "fg=#cdcecf,bg=#3e4a5b,bold"

set -g message-style         "bg=#ebcb8b,fg=#232831"
set -g message-command-style "bg=#ebcb8b,fg=#232831"

setw -g mode-style "bg=#3e4a5b,fg=#cdcecf"
